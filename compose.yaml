services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ossccu-website
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_ADMIN_PIN=ossccu2026
      - DATABASE_URL=postgres://ossccu:ossccu_secret@db:5432/ossccu
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: ossccu-postgres
    environment:
      POSTGRES_USER: ossccu
      POSTGRES_PASSWORD: ossccu_secret
      POSTGRES_DB: ossccu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
